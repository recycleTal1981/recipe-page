<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo overnight oats</title>
<style>
  body { max-width: 700px; margin: 2rem auto; padding: 1rem; font: 18px/1.6 Arial, sans-serif; color: #243c30; background: #edf5ec; }
  main { background: white; padding: 2rem; border-radius: 12px; }
  li { margin: .5rem 0; }
  input { width: 1.2rem; height: 1.2rem; accent-color: #345c41; }
</style>
<main>
  <h1>Overnight oats</h1>
  <p>A tiny recipe page with a shopping checklist. Makes one serving.</p>
  <h2>Ingredients</h2>
  <ul>
    <li><label><input type="checkbox"> ½ cup rolled oats</label></li>
    <li><label><input type="checkbox"> ½ cup milk or oat milk</label></li>
    <li><label><input type="checkbox"> ¼ cup yogurt</label></li>
    <li><label><input type="checkbox"> Fruit for topping</label></li>
  </ul>
  <h2>Steps</h2>
  <ol><li>Mix oats, milk and yogurt in a covered jar.</li><li>Refrigerate overnight.</li><li>Add fruit and enjoy.</li></ol>
  <p><small>Checkboxes reset when the page is reloaded.</small></p>
</main>
</html>
